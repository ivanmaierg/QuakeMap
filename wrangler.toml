name = "quake-map"
main = "apps/api/src/index.ts"
compatibility_date = "2025-09-06"
compatibility_flags = ["nodejs_compat"]

[env.development]
name = "quake-map-dev"

[env.development.vars]
DATABASE_URL = "postgresql://your-dev-db-connection-string"
ENVIRONMENT = "development"
PROJECT_NAME = "QuakeMap API Dev"
USGS_API_URL = "https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary"
CORS_ORIGINS = "http://localhost:5173,http://localhost:3000"

[env.production]
name = "quake-map"

[env.production.vars]
DATABASE_URL = "postgresql://your-prod-db-connection-string"
ENVIRONMENT = "production"
PROJECT_NAME = "QuakeMap API"
USGS_API_URL = "https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary"
CORS_ORIGINS = "https://quake-map-web-dev.pages.dev,https://quake-map-web.pages.dev"
