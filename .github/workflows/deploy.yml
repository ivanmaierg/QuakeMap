name: Deploy to Cloudflare

on:
  push:
    branches: [main, production, 'feature/*', 'develop']
  pull_request:
    branches: [main, production]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Run tests
        run: pnpm test
      
      - name: Run linting
        run: pnpm lint

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Prepare SvelteKit
        run: cd apps/web && pnpm prepare
      
      - name: Build packages
        run: pnpm build

  deploy-api:
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build database package
        run: pnpm build --filter=@quake-map/db
      
      - name: Build API
        run: cd apps/api && pnpm build
      
      - name: Deploy API to Development
        if: github.ref == 'refs/heads/main'
        run: cd apps/api && wrangler deploy --env development --var DATABASE_URL="${{ secrets.DATABASE_URL_DEV }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      
      - name: Deploy API to Production
        if: github.ref == 'refs/heads/production'
        run: cd apps/api && wrangler deploy --env production --var DATABASE_URL="${{ secrets.DATABASE_URL_PROD }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-web:
    runs-on: ubuntu-latest
    needs: [test, build, deploy-api]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Prepare SvelteKit
        run: cd apps/web && pnpm prepare
      
      - name: Build web app
        run: cd apps/web && pnpm build
      
      - name: Deploy Web to Development
        if: github.ref == 'refs/heads/main'
        run: cd apps/web && pnpm deploy:dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          API_URL: ${{ secrets.API_URL_DEV }}
      
      - name: Deploy Web to Production
        if: github.ref == 'refs/heads/production'
        run: cd apps/web && pnpm deploy:prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          API_URL: ${{ secrets.API_URL_PROD }}

  deploy-feature:
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/production' && (startsWith(github.ref, 'refs/heads/feature/') || github.ref == 'refs/heads/develop')
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build database package
        run: pnpm build --filter=@quake-map/db

      - name: Build API
        run: cd apps/api && pnpm build

      - name: Prepare SvelteKit
        run: cd apps/web && pnpm prepare

      - name: Build web app
        run: cd apps/web && pnpm build

      - name: Deploy API to Feature Branch
        run: cd apps/api && wrangler deploy --env development --var DATABASE_URL="${{ secrets.DATABASE_URL_DEV }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Web to Feature Branch
        run: cd apps/web && pnpm deploy:dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          API_URL: ${{ secrets.API_URL_DEV }}
